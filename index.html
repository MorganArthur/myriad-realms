<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>万象之境 · 简单世界模拟器</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div class="brand"><span>✦</span><div><h1>万象之境</h1><p>观察一个自行生长的世界</p></div></div>
      <div class="world-stats">
        <span>纪元 <b id="yearStat">1</b></span><span>人口 <b id="populationStat">0</b></span>
        <span>聚落 <b id="villageStat">0</b></span><span>王国 <b id="kingdomStat">0</b></span>
        <span>天灾 <b id="disasterStat">0</b></span>
      </div>
      <div class="top-actions">
        <button id="pauseBtn" class="icon-btn active" title="暂停或继续">▶</button>
        <button class="speed-btn active" data-speed="1">1×</button><button class="speed-btn" data-speed="2">2×</button><button class="speed-btn" data-speed="4">4×</button>
        <button id="audioBtn" class="icon-btn" title="声音" aria-expanded="false">🔇</button>
        <button id="helpBtn" class="icon-btn" title="新手指引">?</button><button id="codexBtn" class="icon-btn text-icon">百科</button>
      </div>
    </header>

    <section class="workspace">
      <aside class="toolbox panel">
        <h2>创世工具</h2><p class="hint">选中后，在地图上点击或拖动</p>
        <button class="tool active observe-tool" data-tool="inspect"><span>☝</span>观察世界</button>
        <div class="compact-tools">
          <label>改变地形<select data-tool-select="terrain"><option value="">选择地形工具</option><option value="land">🌱 塑造陆地</option><option value="water">💧 化为海洋</option><option value="forest">🌲 播种森林</option></select></label>
          <label>放置生命<select data-tool-select="life"><option value="">选择居民或动物</option><optgroup label="居民"><option value="human">🧑 人类</option><option value="elf">🧝 精灵</option><option value="dwarf">⛏ 矮人</option><option value="orc">👹 兽人</option></optgroup><optgroup label="动物"><option value="rabbit">🐇 野兔</option><option value="deer">🦌 鹿</option><option value="boar">🐗 野猪</option><option value="fox">🦊 赤狐</option><option value="wolf">🐺 狼</option><option value="bear">🐻 棕熊</option></optgroup></select></label>
          <label>使用神力<select data-tool-select="power"><option value="">选择神力</option><option value="bless">✨ 祝福</option><option value="fire">🔥 烈火</option><optgroup label="天灾"><option value="earthquake">🌎 地震</option><option value="flood">🌊 洪水</option><option value="tornado">🌪 龙卷风</option><option value="volcano">🌋 火山</option><option value="plague">☣ 瘟疫</option><option value="drought">☀ 干旱</option></optgroup></select></label>
        </div>
        <p id="activeToolLabel" class="active-tool-label">当前：观察世界</p>
        <label class="range-row">作用范围 <b id="brushValue">2</b><input id="brushSize" type="range" min="1" max="6" value="2" /></label>
        <details class="world-settings"><summary>世界设置</summary><div class="disaster-controls"><label><input id="randomDisasterToggle" type="checkbox" checked /> 随机天灾</label><label>频率 <select id="disasterFrequency"><option value="rare">稀少</option><option value="normal" selected>正常</option><option value="frequent">频繁</option></select></label></div><div class="seed-controls"><label for="worldSeedInput">世界种子</label><div><input id="worldSeedInput" maxlength="64" spellcheck="false" /><button id="randomSeedBtn" title="随机种子">↻</button></div><small>相同种子生成相同初始地图</small></div></details>
        <button id="newWorldBtn" class="wide-btn">生成新世界</button><button id="saveBtn" class="wide-btn secondary">快速保存</button><button id="loadBtn" class="wide-btn secondary">世界档案</button>
      </aside>

      <section class="world-wrap">
        <canvas id="worldCanvas" width="960" height="640" aria-label="模拟世界地图"></canvas>
        <div class="map-mode-control"><label for="mapModeSelect">地图</label><select id="mapModeSelect"><option value="natural">自然</option><option value="political">疆域</option><option value="fertility">肥力</option><option value="population">人口</option><option value="diplomacy">外交</option></select></div>
        <div id="mapLegend" class="map-legend" hidden></div><div class="canvas-help">滚轮缩放 · 右键拖动 · 左键使用工具</div><div id="toast" class="toast"></div>
      </section>

      <aside class="inspector panel">
        <div class="inspector-heading"><div><h2>世界观察</h2><p>只保留最重要的信息</p></div><span id="inspectorAlert" class="inspector-alert">世界平静</span></div>
        <div id="selectionCard" class="selection-card empty"><div class="selection-icon">◌</div><p>点击地图查看土地、居民或聚落</p></div>
        <nav id="inspectorTabs" class="inspector-tabs"><button class="active" data-inspector-tab="overview">概览</button><button data-inspector-tab="kingdoms">王国</button><button data-inspector-tab="history">事件</button></nav>
        <div class="inspector-panels">
          <section class="inspector-tab-panel active" data-inspector-panel="overview">
            <h3>此刻的世界</h3><div id="climateList" class="card-list"></div><div id="societyList" class="card-list compact-summary"></div>
          </section>
          <section class="inspector-tab-panel" data-inspector-panel="kingdoms" hidden>
            <h3>王国资源与建筑</h3><div id="kingdomList" class="kingdom-list"><p class="muted">文明正在萌芽</p></div><h3>外交关系</h3><div id="diplomacyList" class="card-list"></div>
          </section>
          <section class="inspector-tab-panel" data-inspector-panel="history" hidden>
            <h3>活动天灾</h3><div id="disasterList" class="card-list"><p class="muted">世界平静</p></div><div class="section-title-row"><h3>最近发生</h3><button id="exportChronicleBtn" class="text-button">导出全部</button></div><div id="eventLog" class="event-log"></div>
          </section>
        </div>
      </aside>
    </section>
    <footer><span id="worldName">无名世界</span><span id="worldSeedStat">种子尚未生成</span><span id="saveStatus">尚未保存</span><span id="performanceStat">性能监测初始化中</span><span>世界会自行演化</span></footer>
  </main>

  <section id="audioPanel" class="audio-panel" hidden>
    <div class="audio-panel-title"><div><b>世界声音</b><small id="audioSceneLabel">等待开启</small></div><button id="closeAudioPanelBtn">×</button></div>
    <label class="audio-master-switch"><span><b>启用声音</b><small>程序生成的音乐、环境声和事件声</small></span><input id="audioEnabledToggle" type="checkbox" /></label>
    <label class="audio-slider"><span>总音量 <output id="masterVolumeValue">70</output></span><input id="masterVolume" type="range" min="0" max="100" value="70" /></label>
    <label class="audio-slider"><span>背景音乐 <output id="musicVolumeValue">34</output></span><input id="musicVolume" type="range" min="0" max="100" value="34" /></label>
    <label class="audio-slider"><span>环境声 <output id="ambientVolumeValue">46</output></span><input id="ambientVolume" type="range" min="0" max="100" value="46" /></label>
    <label class="audio-slider"><span>事件与界面 <output id="effectsVolumeValue">72</output></span><input id="effectsVolume" type="range" min="0" max="100" value="72" /></label>
  </section>

  <section id="archiveModal" class="modal-backdrop" role="dialog" aria-modal="true" hidden><div class="archive-modal"><div class="modal-title"><div><h2>世界档案</h2><p>保存、导出或导入当前世界</p></div><button id="closeArchiveBtn" class="modal-close">×</button></div><div id="saveSlots" class="save-slots"></div><div class="archive-options"><label><input id="autoSaveToggle" type="checkbox" checked /> 每 5 个纪元自动保存</label><div><button id="exportSaveBtn" class="wide-btn secondary small">导出世界</button><label class="wide-btn secondary small file-label">导入存档<input id="importSaveInput" type="file" accept="application/json,.json" /></label></div></div></div></section>
  <aside id="tutorialPanel" class="tutorial-panel" hidden></aside>
  <section id="codexModal" class="modal-backdrop" role="dialog" aria-modal="true" hidden><div class="codex-modal"><div class="modal-title"><div><h2>世界百科</h2><p>这个简单世界如何运转</p></div><button id="closeCodexBtn" class="modal-close">×</button></div><nav id="codexTabs" class="codex-tabs"><button class="active" data-codex-tab="peoples">居民</button><button data-codex-tab="ecology">生态</button><button data-codex-tab="buildings">建筑</button><button data-codex-tab="disasters">天灾</button><button data-codex-tab="rules">规则</button></nav><div id="codexContent" class="codex-content"></div></div></section>

  <script src="engine-core.js"></script><script src="world-config.js"></script><script src="audio-system.js"></script><script src="pixel-art-system.js"></script><script src="game-persistence.js"></script><script src="experience-system.js"></script><script src="game-ui.js"></script><script src="game.js"></script>
</body>
</html>
