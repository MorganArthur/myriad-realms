<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>万象之境 · 原创像素美术回归页</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { margin: 0; padding: 24px; color: #e8e3ca; background: #0c120d; font-family: "Microsoft YaHei", sans-serif; }
    main { max-width: 1180px; margin: auto; }
    h1 { color: #efd17c; font-size: 24px; }
    h2 { margin-top: 28px; color: #cbb774; font-size: 16px; }
    .preview-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .preview-card { padding: 8px; border: 1px solid #4e573c; border-radius: 7px; background: #171d16; }
    .preview-card b { display: block; margin-top: 6px; color: #d9cfad; font-size: 11px; text-align: center; }
    .preview-hero { width: 100%; aspect-ratio: 2 / 3; border-radius: 4px; }
    .preview-event { width: 100%; aspect-ratio: 9 / 8; border-radius: 4px; }
    .preview-legacy { width: 100%; aspect-ratio: 427 / 458; border-radius: 4px; }
  </style>
</head>
<body>
<main>
  <h1>万象之境 · 原创像素美术回归页</h1>
  <h2>英雄原型 · 3×2</h2>
  <section class="preview-grid">
    <article class="preview-card"><div class="hero-art preview-hero" style="--art-x:0%;--art-y:0%"></div><b>贤王</b></article>
    <article class="preview-card"><div class="hero-art preview-hero" style="--art-x:50%;--art-y:0%"></div><b>守望者</b></article>
    <article class="preview-card"><div class="hero-art preview-hero" style="--art-x:100%;--art-y:0%"></div><b>锻造大师</b></article>
    <article class="preview-card"><div class="hero-art preview-hero" style="--art-x:0%;--art-y:100%"></div><b>战团勇士</b></article>
    <article class="preview-card"><div class="hero-art preview-hero" style="--art-x:50%;--art-y:100%"></div><b>济世者</b></article>
    <article class="preview-card"><div class="hero-art preview-hero" style="--art-x:100%;--art-y:100%"></div><b>远行者</b></article>
  </section>
  <h2>神器与奇观 · 4×2</h2>
  <section class="preview-grid">
    <article class="preview-card"><div class="legacy-atlas-art preview-legacy" style="--art-x:0%;--art-y:0%"></div><b>星界罗盘</b></article>
    <article class="preview-card"><div class="legacy-atlas-art preview-legacy" style="--art-x:33.333%;--art-y:0%"></div><b>泰坦铸锤</b></article>
    <article class="preview-card"><div class="legacy-atlas-art preview-legacy" style="--art-x:66.667%;--art-y:0%"></div><b>苍生之冠</b></article>
    <article class="preview-card"><div class="legacy-atlas-art preview-legacy" style="--art-x:100%;--art-y:0%"></div><b>万邦誓碑</b></article>
    <article class="preview-card"><div class="legacy-atlas-art preview-legacy" style="--art-x:0%;--art-y:100%"></div><b>万卷穹庭</b></article>
    <article class="preview-card"><div class="legacy-atlas-art preview-legacy" style="--art-x:33.333%;--art-y:100%"></div><b>世界根花园</b></article>
    <article class="preview-card"><div class="legacy-atlas-art preview-legacy" style="--art-x:66.667%;--art-y:100%"></div><b>永恒熔炉</b></article>
    <article class="preview-card"><div class="legacy-atlas-art preview-legacy" style="--art-x:100%;--art-y:100%"></div><b>苍穹战垒</b></article>
  </section>
  <h2>大型事件 · 4×3</h2>
  <section class="preview-grid">
    <article class="preview-card"><div class="event-art preview-event" style="--art-x:0%;--art-y:0%"></div><b>星落之谜</b></article>
    <article class="preview-card"><div class="event-art preview-event" style="--art-x:33.333%;--art-y:0%"></div><b>万邦议会</b></article>
    <article class="preview-card"><div class="event-art preview-event" style="--art-x:66.667%;--art-y:0%"></div><b>灰穗之年</b></article>
    <article class="preview-card"><div class="event-art preview-event" style="--art-x:100%;--art-y:0%"></div><b>空王座之争</b></article>
    <article class="preview-card"><div class="event-art preview-event" style="--art-x:0%;--art-y:50%"></div><b>行会革命</b></article>
    <article class="preview-card"><div class="event-art preview-event" style="--art-x:33.333%;--art-y:50%"></div><b>圣火分裂</b></article>
    <article class="preview-card"><div class="event-art preview-event" style="--art-x:66.667%;--art-y:50%"></div><b>无乡者长路</b></article>
    <article class="preview-card"><div class="event-art preview-event" style="--art-x:100%;--art-y:50%"></div><b>远海航路</b></article>
    <article class="preview-card"><div class="event-art preview-event" style="--art-x:0%;--art-y:100%"></div><b>远古巨兽</b></article>
    <article class="preview-card"><div class="event-art preview-event" style="--art-x:33.333%;--art-y:100%"></div><b>火山神谕</b></article>
    <article class="preview-card"><div class="event-art preview-event" style="--art-x:66.667%;--art-y:100%"></div><b>失落之城</b></article>
    <article class="preview-card"><div class="event-art preview-event" style="--art-x:100%;--art-y:100%"></div><b>铁律竞逐</b></article>
  </section>
</main>
</body>
</html>
